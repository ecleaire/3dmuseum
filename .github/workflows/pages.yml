name: Deploy 3D Museum to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      # Legacy branch publishing serves Vite source files without building them.
      # Switch the site to Actions publishing so it cannot overwrite dist/.
      - name: Ensure GitHub Pages uses the built site
        uses: actions/github-script@v7
        with:
          script: |
            const repository = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: pages } = await github.rest.repos.getPages(repository);
            if (pages.build_type !== 'workflow') {
              await github.rest.repos.updateInformationAboutPagesSite({
                ...repository,
                build_type: 'workflow'
              });
            }
            const { data: current } = await github.rest.repos.getPages(repository);
            if (current.build_type !== 'workflow') {
              throw new Error('Set Settings → Pages → Source to GitHub Actions.');
            }
            core.info('Verified Pages source: GitHub Actions');
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
